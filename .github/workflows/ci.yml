name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build + Test (runs on push to main/develop and PRs to main)
  # ---------------------------------------------------------------------------
  test:
    name: Build & Test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

  # ---------------------------------------------------------------------------
  # Job 2: Cross-compile release binaries (runs on tag push v*)
  # ---------------------------------------------------------------------------
  release:
    name: Build ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-linux-musl
            name: linux-x86_64
          - target: aarch64-linux-musl
            name: linux-aarch64
          - target: x86_64-macos
            name: macos-x86_64
          - target: aarch64-macos
            name: macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Rename binary
        run: mv zig-out/bin/pls pls-${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pls-${{ matrix.name }}
          path: pls-${{ matrix.name }}

  # ---------------------------------------------------------------------------
  # Job 3: Create GitHub Release with all binaries attached
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
